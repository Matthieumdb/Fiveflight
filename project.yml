name: EFB
options:
  bundleIdPrefix: com.example.efb
  deploymentTarget:
    iOS: "17.0"
targets:
  EFB:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.efb.app
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Affiche ta position et les aéroports les plus proches."
  EFBTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: EFB
