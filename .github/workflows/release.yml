name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  PROJECT_NAME: Fiveflight
  SCHEME_NAME: Fiveflight

jobs:
  build-and-release:
    name: Build & Release IPA
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Show Xcode Version
        run: xcodebuild -version
      - name: Install xcodegen
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          xcodegen --version
      - name: Generate Xcode Project
        run: xcodegen generate
      - name: Build Archive
        run: |
          xcodebuild \
            -scheme ${SCHEME_NAME} \
            -configuration Release \
            -archivePath build/${PROJECT_NAME}.xcarchive \
            -destination "generic/platform=iOS" \
            archive \
            | xcpretty --color --simple
      - name: Create IPA
        run: |
          mkdir -p build/ipa
          cp .github/ExportOptions.plist build/ExportOptions.plist
          xcodebuild \
            -exportArchive \
            -archivePath build/${PROJECT_NAME}.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist build/ExportOptions.plist \
            -allowProvisioningUpdates
      - name: Find IPA
        id: ipa
        run: |
          IPA_PATH=$(find build/ipa -name "*.ipa" | head -1)
          if [ -z "$IPA_PATH" ]; then
            echo "No IPA found!"
            ls -la build/ipa/
            exit 1
          fi
          echo "IPA_PATH=$IPA_PATH" >> $GITHUB_OUTPUT
          echo "Found IPA: $IPA_PATH"
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Fiveflight ${{ github.ref_name }}
          body: |
            ## Fiveflight ${{ github.ref_name }}

            **Build:** ${{ github.run_number }}
            **Date:** $(date -u +"%Y-%m-%d %H:%M UTC")

            ### Installation
            1. Download the `.ipa` file below
            2. Install via AltStore, Sideloadly, or Xcode
            3. Trust the developer certificate in Settings > General > VPN & Device Management

            ### Requirements
            - iOS 17.0+
            - iPhone or iPad
          files: |
            ${{ steps.ipa.outputs.IPA_PATH }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fiveflight-${{ github.ref_name }}-ipa
          path: ${{ steps.ipa.outputs.IPA_PATH }}
          retention-days: 30
