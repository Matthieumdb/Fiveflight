name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag de release à créer sur le commit choisi (ex. v1.0.40)'
        required: true

permissions:
  contents: write

env:
  PROJECT_NAME: Fiveflight
  SCHEME_NAME: Fiveflight
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build-and-release:
    name: Build & Release Unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Show Xcode Version
        run: xcodebuild -version
      - name: Install xcodegen
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          xcodegen --version
      - name: Generate Xcode Project
        run: xcodegen generate
      - name: Derive version from tag
        run: |
          TAG="${RELEASE_TAG#v}"
          if [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "MARKETING_VERSION=$TAG" >> "$GITHUB_ENV"
            echo "CURRENT_PROJECT_VERSION=${TAG##*.}" >> "$GITHUB_ENV"
          else
            echo "MARKETING_VERSION=$(grep -m1 'MARKETING_VERSION' project.yml | sed -E 's/.*\"(.*)\".*/\1/')" >> "$GITHUB_ENV"
            echo "CURRENT_PROJECT_VERSION=$(grep -m1 'CURRENT_PROJECT_VERSION' project.yml | sed -E 's/.*\"(.*)\".*/\1/')" >> "$GITHUB_ENV"
          fi
      - name: Build Archive (no signing)
        run: |
          set -o pipefail
          xcodebuild \
            -scheme ${SCHEME_NAME} \
            -configuration Release \
            -archivePath build/${PROJECT_NAME}.xcarchive \
            -destination "generic/platform=iOS" \
            archive \
            MARKETING_VERSION="${MARKETING_VERSION}" \
            CURRENT_PROJECT_VERSION="${CURRENT_PROJECT_VERSION}" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --color --simple
      - name: Verify Archive Contents
        run: |
          set -euo pipefail
          APP_PATH=$(find build/${PROJECT_NAME}.xcarchive -type d -name "*.app" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app found in archive"
            exit 1
          fi
          echo "Found app at: $APP_PATH"

          # Check for required files
          echo "=== Verifying archive contents ==="

          # Assets.car
          if [ ! -f "$APP_PATH/Assets.car" ]; then
            echo "ERROR: Assets.car missing from app bundle"
            exit 1
          fi
          echo "✓ Assets.car found"

          # 3 CSV files
          CSV_COUNT=$(find "$APP_PATH" -name "*.csv" | wc -l)
          if [ "$CSV_COUNT" -lt 3 ]; then
            echo "ERROR: Expected at least 3 CSV files, found $CSV_COUNT"
            find "$APP_PATH" -name "*.csv"
            exit 1
          fi
          echo "✓ $CSV_COUNT CSV files found"

          # Widget extension
          if [ ! -d "$APP_PATH/PlugIns/FiveflightWidget.appex" ]; then
            echo "ERROR: FiveflightWidget.appex missing from PlugIns"
            exit 1
          fi
          echo "✓ FiveflightWidget.appex found"

          # Widget must declare its extension point, or iOS refuses to install the whole app
          WIDGET_PLIST="$APP_PATH/PlugIns/FiveflightWidget.appex/Info.plist"
          EXT_POINT=$(/usr/libexec/PlistBuddy -c "Print NSExtension:NSExtensionPointIdentifier" "$WIDGET_PLIST" 2>/dev/null || echo "")
          if [ "$EXT_POINT" != "com.apple.widgetkit-extension" ]; then
            echo "ERROR: widget Info.plist has no NSExtension:NSExtensionPointIdentifier (got '$EXT_POINT')"
            exit 1
          fi
          echo "✓ Widget NSExtension: $EXT_POINT"

          # The app itself must NOT declare NSExtension, or iOS treats it as an extension and won't launch it
          if /usr/libexec/PlistBuddy -c "Print NSExtension" "$APP_PATH/Info.plist" >/dev/null 2>&1; then
            echo "ERROR: app Info.plist contains NSExtension (widget plist leaked into the app target)"
            exit 1
          fi
          echo "✓ App Info.plist has no NSExtension"

          # Orientations must be an array of real values, not one comma-joined string
          if ! /usr/libexec/PlistBuddy -c "Print UISupportedInterfaceOrientations:0" "$APP_PATH/Info.plist" | grep -qx "UIInterfaceOrientationPortrait"; then
            echo "ERROR: UISupportedInterfaceOrientations is malformed"
            exit 1
          fi
          echo "✓ Orientations OK"

          # Bundled CSVs must be US-only (scripts/filter_us_csv.py)
          if ! python3 -c 'import csv,sys; r=csv.DictReader(open(sys.argv[1], newline="", encoding="utf-8")); sys.exit(0 if all(x["iso_country"]=="US" for x in r) else 1)' "$APP_PATH/airports.csv"; then
            echo "ERROR: airports.csv contains non-US airports"
            exit 1
          fi
          echo "✓ airports.csv is US-only"

          # Info.plist checks
          INFO_PLIST="$APP_PATH/Info.plist"
          if [ ! -f "$INFO_PLIST" ]; then
            echo "ERROR: Info.plist missing"
            exit 1
          fi

          # Check CFBundleShortVersionString
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$INFO_PLIST" 2>/dev/null || echo "")
          if [ -z "$VERSION" ]; then
            echo "ERROR: CFBundleShortVersionString missing from Info.plist"
            exit 1
          fi
          echo "✓ CFBundleShortVersionString: $VERSION"

          # Check UILaunchScreen
          if ! /usr/libexec/PlistBuddy -c "Print UILaunchScreen" "$INFO_PLIST" >/dev/null 2>&1; then
            echo "ERROR: UILaunchScreen missing from Info.plist"
            exit 1
          fi
          echo "✓ UILaunchScreen present"

          # Check arm64 only (no armv7)
          ARCHS=$(/usr/libexec/PlistBuddy -c "Print UIRequiredDeviceCapabilities" "$INFO_PLIST" 2>/dev/null | grep -c "arm64" || echo "0")
          if [ "$ARCHS" -eq 0 ]; then
            echo "WARNING: arm64 not explicitly required in UIRequiredDeviceCapabilities"
          fi

          # Check no ATS arbitrary loads
          if /usr/libexec/PlistBuddy -c "Print NSAppTransportSecurity:NSAllowsArbitraryLoads" "$INFO_PLIST" 2>/dev/null | grep -q "true"; then
            echo "ERROR: NSAllowsArbitraryLoads is true (ATS arbitrary loads enabled)"
            exit 1
          fi
          echo "✓ No ATS arbitrary loads"

          # Check no background location
          if /usr/libexec/PlistBuddy -c "Print UIBackgroundModes" "$INFO_PLIST" 2>/dev/null | grep -q "location"; then
            echo "ERROR: Background location mode enabled"
            exit 1
          fi
          echo "✓ No background location"

          echo "=== All archive checks passed ==="
      - name: Create Unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH=$(find build/${PROJECT_NAME}.xcarchive -type d -name "*.app" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app found in archive"
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          echo "App contents:"
          ls -la "$APP_PATH"
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          echo "Payload contents:"
          ls -la build/ipa/Payload/
          cd build/ipa
          IPA_NAME="${PROJECT_NAME}-${RELEASE_TAG}.ipa"
          zip -r "$IPA_NAME" Payload/
          echo "IPA size: $(ls -lh "$IPA_NAME" | awk '{print $5}')"
          echo "IPA_NAME=$IPA_NAME" >> $GITHUB_OUTPUT
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Fiveflight ${{ env.RELEASE_TAG }}
          body: |
            ## Fiveflight ${{ env.RELEASE_TAG }} (Unsigned IPA)

            **Build:** ${{ github.run_number }}
            **Date:** ${{ github.event.head_commit.timestamp }}

            ### ⚠️ IPA non signée
            Cette IPA n'est **pas signée**. Pour l'installer, utilisez **Sideloadly** ou **AltStore** qui la re-signeront avec votre Apple ID.

            ### Installation
            1. Téléchargez `Fiveflight-${{ env.RELEASE_TAG }}.ipa` ci-dessous
            2. Installez via Sideloadly (Windows/macOS) ou AltStore (macOS/iOS)
            3. L'app sera signée avec votre identifiant Apple (valide 7 jours gratuit, 1 an payant)

            ### Prérequis
            - iOS 17.0+ / iPadOS 17.0+
            - iPhone ou iPad
            - Compte Apple ID (gratuit)

          files: |
            build/ipa/Fiveflight-${{ env.RELEASE_TAG }}.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fiveflight-${{ env.RELEASE_TAG }}-unsigned-ipa
          path: build/ipa/Fiveflight-${{ env.RELEASE_TAG }}.ipa
          retention-days: 30