name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  IOS_SIMULATOR: "iPhone 17"

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Install xcodegen
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build and Test
        run: |
          set -o pipefail
          xcodebuild \
            -scheme Fiveflight \
            -destination "platform=iOS Simulator,name=${IOS_SIMULATOR},OS=latest" \
            -configuration Debug \
            -resultBundlePath build/test-results/Tests.xcresult \
            build test \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --color --simple

      - name: Print crash reports (on failure)
        if: failure()
        run: |
          for f in $(find ~/Library/Logs/DiagnosticReports -name "Fiveflight*" -newer project.yml 2>/dev/null | head -3); do
            echo "=== $f"; head -c 20000 "$f"; echo
          done
          xcrun xcresulttool get test-results summary --path build/test-results/Tests.xcresult 2>/dev/null | head -100 || true

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build/test-results/Tests.xcresult
          retention-days: 7

  lint:
    name: SwiftLint
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: |
          if ! command -v swiftlint &> /dev/null; then
            brew install swiftlint
          fi

      - name: Run SwiftLint
        run: swiftlint lint Sources