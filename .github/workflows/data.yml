name: Refresh bundled data

# Regenerates Resources/airspace_snapshot.json from the FAA ADDS layers and
# keeps the OurAirports CSVs US-only, then commits the result to the branch.
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths:
      - scripts/**
      - .github/workflows/data.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build FAA airspace snapshot (Florida)
        run: python3 scripts/build_airspace_snapshot.py Resources/airspace_snapshot.json
      - name: Keep OurAirports CSVs US-only
        run: python3 scripts/filter_us_csv.py Resources
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Resources/airspace_snapshot.json Resources/*.csv
          if git diff --cached --quiet; then echo "No data changes"; exit 0; fi
          git commit -m "data: regenerate FAA airspace snapshot (Florida) and US-only CSVs"
          git push
