name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: |
          curl -L https://github.com/yonaskolb/XcodeGen/releases/download/2.42.0/xcodegen.zip -o xcodegen.zip
          unzip xcodegen.zip -d $RUNNER_TEMP/xcodegen
          chmod +x $RUNNER_TEMP/xcodegen/xcodegen/bin/xcodegen
          echo "$RUNNER_TEMP/xcodegen/xcodegen/bin" >> $GITHUB_PATH

      - name: Generate project
        run: xcodegen generate

      - name: Build for Release
        run: |
          xcodebuild -project EFB.xcodeproj \
            -scheme EFB \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/EFB.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Export IPA
        run: |
          mkdir -p build/Export
          xcodebuild -exportArchive \
            -archivePath build/EFB.xcarchive \
            -exportPath build/Export \
            -exportOptionsPlist ExportOptions.plist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/Export/EFB.ipa
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}