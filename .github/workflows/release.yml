name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  PROJECT_NAME: Fiveflight
  SCHEME_NAME: Fiveflight

jobs:
  build-and-release:
    name: Build & Release Archive
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Show Xcode Version
        run: xcodebuild -version
      - name: Install xcodegen
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          xcodegen --version
      - name: Generate Xcode Project
        run: xcodegen generate
      - name: Build Archive
        run: |
          xcodebuild \
            -scheme ${SCHEME_NAME} \
            -configuration Release \
            -archivePath build/${PROJECT_NAME}.xcarchive \
            -destination "generic/platform=iOS" \
            archive \
            | xcpretty --color --simple
      - name: Zip Archive
        run: |
          ARCHIVE_PATH="$(pwd)/build/${PROJECT_NAME}.xcarchive"
          echo "Archive path: $ARCHIVE_PATH"
          ls -la "$ARCHIVE_PATH" || echo "Archive not found at expected path"
          find "$(pwd)" -name "*.xcarchive" -type d 2>/dev/null | head -5
          cd "$(pwd)/build"
          zip -r "${PROJECT_NAME}.xcarchive.zip" "${PROJECT_NAME}.xcarchive"
          echo "Zip created: $(ls -la ${PROJECT_NAME}.xcarchive.zip)"
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Fiveflight ${{ github.ref_name }}
          body: |
            ## Fiveflight ${{ github.ref_name }}

            **Build:** ${{ github.run_number }}
            **Date:** $(date -u +"%Y-%m-%d %H:%M UTC")

            ### Download
            - **XCArchive:** `Fiveflight.xcarchive.zip` (below)
            - **Source Code:** Source code zip/tar.gz (auto-generated)

            ### Creating IPA Locally
            1. Download and unzip `Fiveflight.xcarchive.zip`
            2. Open in Xcode: `open Fiveflight.xcarchive`
            3. Click "Distribute App" → "Development" or "Ad Hoc"
            4. Follow the signing wizard with your Apple ID
            5. Install via AltStore, Sideloadly, or Xcode

            ### Requirements
            - iOS 17.0+
            - iPhone or iPad
            - Apple ID (free) for development signing
          files: |
            build/${PROJECT_NAME}.xcarchive.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload Archive Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fiveflight-${{ github.ref_name }}-xcarchive
          path: build/${PROJECT_NAME}.xcarchive.zip
          retention-days: 30
