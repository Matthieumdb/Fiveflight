name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  IOS_SIMULATOR: "iPhone 17"

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Install xcodegen
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Check app target uses the generated Info.plist
        run: |
          PLIST=$(xcodebuild -showBuildSettings -project Fiveflight.xcodeproj -target Fiveflight 2>/dev/null | awk -F' = ' '/^ *INFOPLIST_FILE = /{print $2}')
          echo "Fiveflight INFOPLIST_FILE='$PLIST'"
          if [ -n "$PLIST" ]; then
            echo "ERROR: the app target picked up an Info.plist file ($PLIST); it must use the generated one"
            exit 1
          fi

      - name: Pick a simulator
        run: |
          # Runner images change their simulator set; fall back to any available iPhone.
          if ! xcrun simctl list devices available | grep -q "${IOS_SIMULATOR} ("; then
            SIM=$(xcrun simctl list devices available | grep -oE "iPhone [^(]+" | sed 's/ *$//' | tail -1)
            if [ -z "$SIM" ]; then
              RUNTIME=$(xcrun simctl list runtimes available | grep -oE "com.apple.CoreSimulator.SimRuntime.iOS-[0-9-]+" | tail -1)
              TYPE=$(xcrun simctl list devicetypes | grep -oE "com.apple.CoreSimulator.SimDeviceType.iPhone-[0-9]+" | tail -1)
              xcrun simctl create "CI iPhone" "$TYPE" "$RUNTIME"
              SIM="CI iPhone"
            fi
            echo "IOS_SIMULATOR=$SIM" >> "$GITHUB_ENV"
          fi

      - name: Build and Test
        run: |
          set -o pipefail
          echo "Simulator: ${IOS_SIMULATOR}"
          xcodebuild \
            -scheme Fiveflight \
            -destination "platform=iOS Simulator,name=${IOS_SIMULATOR}" \
            -configuration Debug \
            -resultBundlePath build/test-results/Tests.xcresult \
            build test \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --color --simple

      - name: Print crash reports (on failure)
        if: failure()
        run: |
          for f in $(find ~/Library/Logs/DiagnosticReports -name "Fiveflight*" -newer project.yml 2>/dev/null | head -3); do
            echo "=== $f"; head -c 20000 "$f"; echo
          done
          xcrun xcresulttool get test-results summary --path build/test-results/Tests.xcresult 2>/dev/null | head -100 || true

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build/test-results/Tests.xcresult
          retention-days: 7

  lint:
    name: SwiftLint
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: |
          if ! command -v swiftlint &> /dev/null; then
            brew install swiftlint
          fi

      - name: Run SwiftLint
        run: swiftlint lint Sources