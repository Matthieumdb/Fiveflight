name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: |
          curl -L https://github.com/yonaskolb/XcodeGen/releases/download/2.45.0/xcodegen.zip -o xcodegen.zip
          unzip xcodegen.zip -d $RUNNER_TEMP/xcodegen
          chmod +x $RUNNER_TEMP/xcodegen/bin/xcodegen
          echo "$RUNNER_TEMP/xcodegen/bin" >> $GITHUB_PATH

      - name: Generate project
        run: xcodegen generate

      - name: Build and Test
        run: |
          xcodebuild -project EFB.xcodeproj \
            -scheme EFB \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -configuration Debug \
            build test \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO