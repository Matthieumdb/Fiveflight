# SwiftLint configuration for Fiveflight
# Based on recommended settings for Swift 6 / iOS 17+

disabled_rules:
  - trailing_whitespace
  - line_length
  - file_length
  - type_body_length
  - function_body_length
  - cyclomatic_complexity
  - nesting

opt_in_rules:
  - empty_count
  - empty_string
  - force_unwrapping
  - implicitly_unwrapped_optional
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_imports
  - unused_import
  - vertical_parameter_alignment_on_call
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces

excluded:
  - build
  - build-ios
  - dist
  - .build
  - Pods
  - Carthage
  - Tests/Generated

analyzer_rules:
  - explicit_self
  - unused_import

included:
  - Sources

line_length:
  warning: 120
  error: 160

type_body_length:
  warning: 300
  error: 500

function_body_length:
  warning: 80
  error: 120

file_length:
  warning: 500
  error: 1000

cyclomatic_complexity:
  warning: 15
  error: 25

nesting:
  type_level:
    warning: 3
    error: 4
  function_level:
    warning: 4
    error: 5

reporter: "xcode"