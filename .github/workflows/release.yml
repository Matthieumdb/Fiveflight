name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  PROJECT_NAME: Fiveflight
  SCHEME_NAME: Fiveflight

jobs:
  build-and-release:
    name: Build & Release Unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Show Xcode Version
        run: xcodebuild -version
      - name: Install xcodegen
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          xcodegen --version
      - name: Generate Xcode Project
        run: xcodegen generate
      - name: Build Archive (no signing)
        run: |
          xcodebuild \
            -scheme ${SCHEME_NAME} \
            -configuration Release \
            -archivePath build/${PROJECT_NAME}.xcarchive \
            -destination "generic/platform=iOS" \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --color --simple
      - name: Create Unsigned IPA
        run: |
          mkdir -p build/ipa/Payload
          # Copy .app from archive to Payload
          cp -R build/${PROJECT_NAME}.xcarchive/Products/Applications/${PROJECT_NAME}.app build/ipa/Payload/
          # Create IPA (just a zip with Payload/)
          cd build/ipa
          zip -r ${PROJECT_NAME}.ipa Payload/
          echo "IPA size: $(ls -lh ${PROJECT_NAME}.ipa | awk '{print $5}')"
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Fiveflight ${{ github.ref_name }}
          body: |
            ## Fiveflight ${{ github.ref_name }} (Unsigned IPA for Jailbroken)

            **Build:** ${{ github.run_number }}
            **Date:** $(date -u +"%Y-%m-%d %H:%M UTC")

            ### ⚠️ Unsigned IPA - Jailbroken Only
            This IPA has **no code signature**. Only install on jailbroken devices.

            ### Installation
            1. Download `Fiveflight.ipa` below
            2. Install via Filza, IPA Installer, or SSH to `/var/mobile/Applications/`
            3. Respring if needed

            ### Requirements
            - Jailbroken iOS 17.0+
            - iPhone or iPad
          files: |
            build/ipa/Fiveflight.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fiveflight-${{ github.ref_name }}-unsigned-ipa
          path: build/ipa/Fiveflight.ipa
          retention-days: 30
