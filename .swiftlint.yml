# SwiftLint configuration for Fiveflight
# Based on recommended settings for Swift 6 / iOS 17+

disabled_rules:
  - trailing_whitespace
  - line_length
  - file_length
  - type_body_length
  - function_body_length
  - cyclomatic_complexity
  - nesting
  - large_tuple
  - todo
  - identifier_name
  - force_unwrapping
  - sorted_imports
  - for_where
  - vertical_parameter_alignment_on_call
  - function_parameter_count
  - trailing_newline
  - statement_position
  - opening_brace
  - trailing_comma
  - redundant_string_enum_value
  - multiple_closures_with_trailing_closure

opt_in_rules:
  - empty_count
  - empty_string
  - implicitly_unwrapped_optional
  - redundant_nil_coalescing
  - redundant_type_annotation
  - unused_import

excluded:
  - build
  - build-ios
  - dist
  - .build
  - Pods
  - Carthage
  - Tests/Generated

analyzer_rules:
  - explicit_self
  - unused_import

included:
  - Sources

reporter: "xcode"