name: Fiveflight
options:
  bundleIdPrefix: com.fiveflight
  deploymentTarget:
    iOS: "17.0"
  minimumXcodeGenVersion: "2.45"
  settings:
    base:
      SWIFT_VERSION: "6.0"

targets:
  Fiveflight:
    type: application
    platform: iOS
    sources: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "com.fiveflight.app"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Fiveflight needs your location"
        CODE_SIGN_STYLE: "Automatic"
        DEVELOPMENT_TEAM: ""

  FiveflightTests:
    type: bundle.unit-test
    platform: iOS
    sources: Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "com.fiveflight.app.tests"
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies:
      - target: Fiveflight

schemes:
  Fiveflight:
    build:
      targets:
        Fiveflight: all
        FiveflightTests: [test]
    test:
      targets:
        - FiveflightTests