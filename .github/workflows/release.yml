name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  PROJECT_NAME: Fiveflight
  SCHEME_NAME: Fiveflight

jobs:
  build-and-release:
    name: Build & Release Archive
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Show Xcode Version
        run: xcodebuild -version
      - name: Install xcodegen
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          xcodegen --version
      - name: Generate Xcode Project
        run: xcodegen generate
      - name: Build Archive
        run: |
          xcodebuild \
            -scheme ${SCHEME_NAME} \
            -configuration Release \
            -archivePath build/${PROJECT_NAME}.xcarchive \
            -destination "generic/platform=iOS" \
            archive \
            | xcpretty --color --simple
      - name: Debug Archive
        run: |
          echo "=== Debug Archive ==="
          pwd
          ls -la build/
          echo "Archive exists: $(test -d build/${PROJECT_NAME}.xcarchive && echo YES || echo NO)"
          echo "Archive type: $(file build/${PROJECT_NAME}.xcarchive 2>/dev/null || echo 'not found')"
          ls -la build/${PROJECT_NAME}.xcarchive/ 2>/dev/null | head -5
      - name: Create Archive Zip
        run: |
          ditto -ck --sequesterRsrc --keepParent build/${PROJECT_NAME}.xcarchive build/${PROJECT_NAME}.xcarchive.zip
          echo "Zip size: $(ls -lh build/${PROJECT_NAME}.xcarchive.zip | awk '{print $5}')"
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Fiveflight ${{ github.ref_name }}
          body: |
            ## Fiveflight ${{ github.ref_name }}

            **Build:** ${{ github.run_number }}
            **Date:** $(date -u +"%Y-%m-%d %H:%M UTC")

            ### Download
            - **XCArchive:** `Fiveflight.xcarchive.zip` (attached below)
            - **Source Code:** Source code zip/tar.gz (auto-generated)

            ### Creating IPA Locally
            1. Download and unzip `Fiveflight.xcarchive.zip`
            2. Open in Xcode: `open Fiveflight.xcarchive`
            3. Click "Distribute App" → "Development" or "Ad Hoc"
            4. Follow the signing wizard with your Apple ID
            5. Install via AltStore, Sideloadly, or Xcode

            ### Requirements
            - iOS 17.0+
            - iPhone or iPad
            - Apple ID (free) for development signing
          files: |
            build/${PROJECT_NAME}.xcarchive.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload Archive Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fiveflight-${{ github.ref_name }}-xcarchive
          path: build/${PROJECT_NAME}.xcarchive.zip
          retention-days: 30
