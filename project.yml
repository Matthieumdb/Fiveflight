name: Fiveflight
options:
  bundleIdPrefix: com.fiveflight.app
  deploymentTarget:
    iOS: "17.0"
targets:
  Fiveflight:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - "**/Widgets/**"
      - path: Resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.fiveflight.app
        MARKETING_VERSION: "1.0.39"
        CURRENT_PROJECT_VERSION: "39"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Fiveflight
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Affiche ta position et les aéroports les plus proches pour la navigation VFR."
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Fiveflight.entitlements
    dependencies:
      - target: FiveflightWidget
        embed: true
  FiveflightWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Widgets
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.fiveflight.app.widget
        MARKETING_VERSION: "1.0.39"
        CURRENT_PROJECT_VERSION: "39"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: FiveflightWidget.entitlements
    info:
      path: Sources/Widgets/Info.plist
      properties:
        CFBundleDisplayName: Fiveflight
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  FiveflightTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.fiveflight.app.tests
    dependencies:
      - target: Fiveflight